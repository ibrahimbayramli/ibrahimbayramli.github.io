<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — İbrahim Bayramlı</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #07090f; --surface: #111827; --border: rgba(255,255,255,0.07);
      --accent: #4f8ef7; --accent2: #06b6d4; --text: #e2e8f0; --muted: #64748b;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f0f4f8; --surface: #ffffff; --border: rgba(15,23,42,0.1); --accent: #2563eb; --text: #334155; --muted: #64748b; }
    }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .container { text-align: center; padding: 2rem; max-width: 480px; }
    .code {
      font-family: 'JetBrains Mono', monospace; font-size: clamp(5rem, 20vw, 8rem);
      font-weight: 900; line-height: 1; letter-spacing: -4px; margin-bottom: 1.5rem;
      background: linear-gradient(130deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .title { font-size: 1.4rem; font-weight: 800; color: var(--text); margin-bottom: 0.75rem; }
    .desc { color: var(--muted); font-size: 0.95rem; line-height: 1.7; margin-bottom: 2rem; }
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: var(--accent); color: #fff; text-decoration: none;
      padding: 0.75rem 1.75rem; border-radius: 10px; font-weight: 600; font-size: 0.9rem;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .timer { margin-top: 1.2rem; font-size: 0.78rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">{404}</div>
    <div class="title">Sayfa Bulunamadı</div>
    <div class="desc">Aradığın sayfa mevcut değil veya taşınmış olabilir.</div>
    <a href="/" class="btn">← Anasayfaya Dön</a>
    <div class="timer" id="timer"></div>
  </div>
  <script>
    // SPA routing: if path matches a known section, redirect silently
    const KNOWN = ['/', '/hakkimda', '/deneyim', '/teknolojiler', '/yetkinlikler', '/egitim', '/sertifikalar', '/iletisim'];
    const path = window.location.pathname;
    if (KNOWN.includes(path)) {
      sessionStorage.setItem('ghpages_redirect', path + window.location.search + window.location.hash);
      window.location.replace('/');
    } else {
      // Unknown path: show error page with countdown
      let sec = 5;
      const el = document.getElementById('timer');
      el.textContent = sec + 's içinde yönlendiriliyorsunuz...';
      const iv = setInterval(() => {
        sec--;
        if (sec <= 0) { clearInterval(iv); window.location.replace('/'); }
        else el.textContent = sec + 's içinde yönlendiriliyorsunuz...';
      }, 1000);
    }
  </script>
</body>
</html>
