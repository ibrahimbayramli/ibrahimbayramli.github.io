<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>İbrahim Bayramlı — Software Engineer</title>
  <meta name="description" content="Backend odaklı Software Engineer. Java, Spring Boot, mikroservis mimarisi ve dağıtık sistemler." />
  <meta name="author" content="İbrahim Bayramlı" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:              #07090f;
      --bg2:             #0c0f1a;
      --surface:         #111827;
      --surface2:        #1a2234;
      --border:          rgba(255,255,255,0.07);
      --accent:          #4f8ef7;
      --accent2:         #06b6d4;
      --green:           #22d3a5;
      --glow:            rgba(79,142,247,0.3);
      --text:            #e2e8f0;
      --muted:           #64748b;
      --white:           #ffffff;
      --radius:          14px;
      --ease:            cubic-bezier(0.4,0,0.2,1);
      --nav-scrolled-bg: rgba(7,9,15,0.88);
      --overlay-bg:      rgba(7,9,15,0.97);
    }
    [data-theme="light"] {
      --bg:              #f0f4f8;
      --bg2:             #e8edf5;
      --surface:         #ffffff;
      --surface2:        #f1f5f9;
      --border:          rgba(15,23,42,0.1);
      --accent:          #2563eb;
      --accent2:         #0891b2;
      --green:           #059669;
      --glow:            rgba(37,99,235,0.2);
      --text:            #334155;
      --muted:           #64748b;
      --white:           #0f172a;
      --nav-scrolled-bg: rgba(240,244,248,0.92);
      --overlay-bg:      rgba(240,244,248,0.97);
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
      line-height: 1.6; overflow-x: hidden;
      transition: background 0.35s ease, color 0.35s ease;
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
    #root { min-height: 100vh; }

    /* ── GLOBAL ── */
    .section { padding: 110px 6%; position: relative; z-index: 1; }
    .section--alt { background: var(--bg2); }
    .inner { max-width: 1140px; margin: 0 auto; }
    .label {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 2.5px;
      color: var(--accent); text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace; margin-bottom: 0.5rem;
      display: block;
    }
    .heading {
      font-size: clamp(1.9rem, 3.5vw, 2.8rem); font-weight: 800;
      color: var(--white); letter-spacing: -1.2px; line-height: 1.15;
      margin-bottom: 1rem;
    }
    .desc { color: var(--muted); font-size: 0.97rem; max-width: 560px; line-height: 1.8; margin-bottom: 3.5rem; }

    /* ── NAV ── */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      height: 68px; padding: 0 6%;
      display: flex; align-items: center; justify-content: space-between;
      transition: background 0.3s var(--ease), border-color 0.3s var(--ease), backdrop-filter 0.3s;
      border-bottom: 1px solid transparent;
    }
    .nav--scrolled {
      background: var(--nav-scrolled-bg);
      backdrop-filter: blur(22px);
      border-bottom-color: var(--border);
    }
    .nav__logo { font-size: 1.05rem; font-weight: 800; color: var(--white); text-decoration: none; letter-spacing: -0.5px; font-family: monospace; }
    .nav__logo span { color: var(--accent); }
    .nav__links { display: flex; gap: 2.2rem; list-style: none; }
    .nav__links a { color: var(--muted); text-decoration: none; font-size: 0.87rem; font-weight: 500; transition: color 0.2s; }
    .nav__links a:hover { color: var(--white); }
    .nav__links a.nav__active { color: var(--accent); }
    .hamburger { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 4px; }
    .hamburger span { display: block; width: 24px; height: 2px; background: var(--text); border-radius: 2px; transition: all 0.3s var(--ease); }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .mobile-overlay {
      position: fixed; inset: 0; z-index: 999;
      background: var(--overlay-bg); backdrop-filter: blur(24px);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.5rem;
      transform: translateX(100%); transition: transform 0.35s var(--ease);
    }
    .mobile-overlay.open { transform: translateX(0); }
    .mobile-overlay a { font-size: 1.6rem; font-weight: 700; color: var(--text); text-decoration: none; transition: color 0.2s; }
    .mobile-overlay a:hover { color: var(--accent); }

    /* ── HERO ── */
    .hero {
      min-height: 100vh; padding: 0 6%;
      display: flex; align-items: center;
      position: relative; overflow: hidden;
    }
    .hero__inner { max-width: 1140px; margin: 0 auto; width: 100%; display: grid; grid-template-columns: 1fr 400px; gap: 5rem; align-items: center; }
    .hero__badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(79,142,247,0.1); border: 1px solid rgba(79,142,247,0.3);
      color: var(--accent); font-size: 0.78rem; font-weight: 700;
      padding: 6px 14px; border-radius: 100px; letter-spacing: 0.6px;
      margin-bottom: 1.5rem; font-family: 'JetBrains Mono', monospace;
    }
    .hero__badge-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: blink 1.8s ease infinite; }
    @keyframes blink { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.5)} }
    .hero__title { font-size: clamp(2.8rem, 5.5vw, 4.6rem); font-weight: 900; line-height: 1.04; letter-spacing: -2.5px; color: var(--white); margin-bottom: 1.2rem; }
    .hero__title .grad { background: linear-gradient(130deg, var(--accent), var(--accent2) 60%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .hero__sub { font-size: 1.05rem; color: var(--muted); max-width: 500px; line-height: 1.8; margin-bottom: 2.5rem; }
    .hero__sub strong { color: var(--text); font-weight: 600; }
    .hero__btns { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 2rem; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 13px 26px; border-radius: 11px; font-size: 0.88rem; font-weight: 600; text-decoration: none; transition: all 0.25s var(--ease); border: none; cursor: pointer; font-family: 'Inter', sans-serif; }
    .btn--primary { background: var(--accent); color: #fff; box-shadow: 0 0 35px var(--glow); }
    .btn--primary:hover { background: #3b7ef0; transform: translateY(-2px); box-shadow: 0 0 50px var(--glow); }
    .btn--ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn--ghost:hover { border-color: var(--accent); background: var(--surface2); transform: translateY(-2px); }
    /* ── THEME TOGGLE ── */
    .theme-toggle {
      width: 38px; height: 38px; border-radius: 10px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.25s var(--ease); flex-shrink: 0;
    }
    .theme-toggle:hover { color: var(--accent); border-color: var(--accent); background: var(--surface2); }
    .hero__stats { display: flex; gap: 3rem; margin-top: 0; padding-top: 2rem; border-top: 1px solid var(--border); }
    .stat__num { font-size: 2rem; font-weight: 900; color: var(--white); line-height: 1; }
    .stat__label { font-size: 0.74rem; color: var(--muted); margin-top: 4px; font-weight: 500; }
    /* photo */
    .hero__photo-wrap {
      position: relative;
      animation: fadeRight 0.9s 0.2s ease both;
    }
    .hero__photo-wrap::before {
      content: ''; position: absolute; inset: -2px; border-radius: 22px; z-index: -1;
      background: linear-gradient(135deg, var(--accent), var(--accent2), rgba(0,0,0,0));
      opacity: 0.65;
    }
    .hero__photo-wrap::after {
      content: ''; position: absolute; inset: -60px; z-index: -2; border-radius: 50%;
      background: radial-gradient(circle, rgba(79,142,247,0.13) 0%, transparent 65%);
    }
    .hero__photo { width: 100%; display: block; border-radius: 20px; object-fit: cover; aspect-ratio: 4/5; filter: grayscale(10%); transition: filter 0.4s; }
    .hero__photo:hover { filter: grayscale(0%); }
    /* blobs */
    .blob { position: absolute; border-radius: 50%; filter: blur(100px); pointer-events: none; z-index: 0; }
    .blob--1 { width: 600px; height: 600px; top: -150px; left: -150px; background: radial-gradient(circle, rgba(79,142,247,0.1) 0%, transparent 70%); }
    .blob--2 { width: 500px; height: 500px; bottom: -100px; right: 0; background: radial-gradient(circle, rgba(6,182,212,0.07) 0%, transparent 70%); }
    .blob--3 { width: 300px; height: 300px; top: 30%; left: 40%; background: radial-gradient(circle, rgba(34,211,165,0.05) 0%, transparent 70%); }
    /* animations */
    @keyframes fadeUp   { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeRight{ from{opacity:0;transform:translateX(30px)} to{opacity:1;transform:translateX(0)} }
    .anim-1 { animation: fadeUp 0.65s 0.05s ease both; }
    .anim-2 { animation: fadeUp 0.65s 0.15s ease both; }
    .anim-3 { animation: fadeUp 0.65s 0.25s ease both; }
    .anim-4 { animation: fadeUp 0.65s 0.35s ease both; }
    .anim-5 { animation: fadeUp 0.65s 0.45s ease both; }

    /* ── ABOUT ── */
    .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5rem; align-items: center; }
    .about-text p { color: var(--muted); font-size: 0.97rem; line-height: 1.85; margin-bottom: 1.1rem; }
    .about-text p strong { color: var(--text); font-weight: 600; }
    .socials { display: flex; gap: 0.8rem; margin-top: 2rem; flex-wrap: wrap; }
    .social-btn {
      width: 44px; height: 44px; border-radius: 11px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); display: inline-flex; align-items: center; justify-content: center;
      text-decoration: none; font-size: 1rem; transition: all 0.25s var(--ease);
    }
    .social-btn:hover { color: var(--accent); border-color: rgba(79,142,247,0.4); background: rgba(79,142,247,0.08); transform: translateY(-3px); }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; }
    .info-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.3rem 1.2rem;
      transition: border-color 0.25s var(--ease), transform 0.25s var(--ease);
    }
    .info-card:hover { border-color: rgba(79,142,247,0.3); transform: translateY(-2px); }
    .info-card__icon { font-size: 1.4rem; margin-bottom: 0.5rem; }
    .info-card__label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); font-weight: 600; margin-bottom: 0.25rem; }
    .info-card__value { font-size: 0.88rem; color: var(--white); font-weight: 600; }

    /* ── TIMELINE ── */
    .timeline { position: relative; padding-left: 2.2rem; }
    .timeline::before { content:''; position:absolute; left:0; top:10px; bottom:20px; width:1px; background: linear-gradient(to bottom, var(--accent) 0%, transparent 100%); }
    .tl-item { position: relative; margin-bottom: 3rem; opacity:0; transform:translateY(20px); transition: all 0.5s ease; }
    .tl-item.show { opacity:1; transform:translateY(0); }
    .tl-dot { position:absolute; left:-2.45rem; top:5px; width:13px; height:13px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px rgba(79,142,247,0.18); }
    .tl-meta { font-size:0.75rem; color:var(--muted); font-family:'JetBrains Mono',monospace; margin-bottom:0.4rem; }
    .tl-company { font-size:1.15rem; font-weight:800; color:var(--white); margin-bottom:0.15rem; }
    .tl-role { font-size:0.82rem; color:var(--accent); font-weight:700; margin-bottom:1rem; letter-spacing:0.3px; }
    .tl-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:1.6rem; transition: border-color 0.25s var(--ease); }
    .tl-card:hover { border-color:rgba(79,142,247,0.25); }
    .tl-list { list-style:none; display:flex; flex-direction:column; gap:0.7rem; }
    .tl-list li { display:flex; gap:0.8rem; font-size:0.88rem; color:var(--muted); line-height:1.7; }
    .tl-list li::before { content:'→'; color:var(--accent); flex-shrink:0; font-family:'JetBrains Mono',monospace; font-weight:700; margin-top:1px; }

    /* ── TECH ── */
    .tech-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:0.9rem; }
    .tech-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius); padding:1.4rem 1rem;
      text-align:center; cursor:default; opacity:0; transform:scale(0.94);
      transition:all 0.35s ease;
    }
    .tech-card.show { opacity:1; transform:scale(1); }
    .tech-card:hover { border-color:rgba(79,142,247,0.4); background:rgba(79,142,247,0.06); transform:translateY(-5px); }
    .tech-card__icon { font-size:2rem; margin-bottom:0.55rem; display:block; }
    .tech-card__logo { width:44px; height:44px; object-fit:contain; margin:0 auto 0.55rem; display:block; }
    .tech-card__name { font-size:0.8rem; font-weight:700; color:var(--text); margin-bottom:0.3rem; }
    .tech-card__level { font-size:0.67rem; font-family:'JetBrains Mono',monospace; font-weight:600; }
    .tech-card__level.native { color:var(--accent); }
    .tech-card__level.professional { color:var(--accent2); }

    /* ── STRENGTHS ── */
    .str-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:1rem; }
    .str-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius); padding:1.8rem 1.5rem;
      opacity:0; transform:translateY(18px); transition:all 0.4s ease;
    }
    .str-card.show { opacity:1; transform:translateY(0); }
    .str-card:hover { border-color:rgba(79,142,247,0.35); background:rgba(79,142,247,0.05); transform:translateY(-4px); }
    .str-card__icon { font-size:1.9rem; margin-bottom:0.8rem; display:block; }
    .str-card__title { font-size:0.87rem; font-weight:700; color:var(--white); line-height:1.4; }

    /* ── EDUCATION ── */
    .edu-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.4rem; }
    .edu-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius); padding:2rem;
      opacity:0; transform:translateY(18px); transition:all 0.4s ease;
    }
    .edu-card.show { opacity:1; transform:translateY(0); }
    .edu-card:hover { border-color:rgba(79,142,247,0.3); transform:translateY(-3px); }
    .edu-badge {
      display:inline-block; font-size:0.7rem; font-weight:700; letter-spacing:1px; text-transform:uppercase;
      color:var(--accent); background:rgba(79,142,247,0.1); border:1px solid rgba(79,142,247,0.22);
      padding:4px 11px; border-radius:7px; margin-bottom:1rem;
    }
    .edu-degree { font-size:1.05rem; font-weight:800; color:var(--white); margin-bottom:0.3rem; }
    .edu-school { font-size:0.88rem; color:var(--accent2); font-weight:600; margin-bottom:0.4rem; }
    .edu-date { font-size:0.74rem; color:var(--muted); font-family:'JetBrains Mono',monospace; }
    .edu-desc { margin-top:0.8rem; font-size:0.87rem; color:var(--muted); line-height:1.75; }

    /* ── CONTACT ── */
    .contact-wrap { display:flex; justify-content:center; }
    .contact-box {
      max-width:660px; width:100%;
      background:var(--surface); border:1px solid var(--border);
      border-radius:22px; padding:3.5rem;
      position:relative; overflow:hidden; text-align:center;
    }
    .contact-box::before {
      content:''; position:absolute; inset:0; border-radius:inherit;
      background:radial-gradient(ellipse at 50% -10%, rgba(79,142,247,0.13) 0%, transparent 60%);
      pointer-events:none;
    }
    .contact-box h3 { font-size:1.9rem; font-weight:800; color:var(--white); letter-spacing:-0.5px; margin-bottom:0.8rem; }
    .contact-box p { color:var(--muted); font-size:0.97rem; line-height:1.75; margin-bottom:2.2rem; }
    .contact-links { display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; margin-top:2rem; padding-top:2rem; border-top:1px solid var(--border); }
    .contact-link { display:inline-flex; align-items:center; gap:7px; color:var(--muted); text-decoration:none; font-size:0.82rem; font-weight:500; transition:color 0.2s; }
    .contact-link:hover { color:var(--accent); }
    /* ── CERTIFICATES ── */
    .cert-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:1rem; }
    .cert-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius); padding:1.3rem 1.4rem;
      display:flex; gap:1rem; align-items:flex-start;
      opacity:0; transform:translateY(16px); transition:all 0.4s ease;
    }
    .cert-card.show { opacity:1; transform:translateY(0); }
    .cert-card:hover { border-color:rgba(79,142,247,0.3); transform:translateY(-3px); }
    .cert-issuer-dot {
      width:38px; height:38px; border-radius:9px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:0.65rem; font-weight:800; letter-spacing:0.3px; color:#fff;
    }
    .cert-body { flex:1; min-width:0; }
    .cert-name { font-size:0.88rem; font-weight:700; color:var(--white); line-height:1.35; margin-bottom:0.25rem; }
    .cert-issuer { font-size:0.76rem; color:var(--accent2); font-weight:600; margin-bottom:0.2rem; }
    .cert-date { font-size:0.72rem; color:var(--muted); font-family:'JetBrains Mono',monospace; margin-bottom:0.5rem; }
    .cert-skills { display:flex; flex-wrap:wrap; gap:0.35rem; }
    .cert-skill {
      font-size:0.66rem; font-weight:600; padding:2px 8px; border-radius:5px;
      background:rgba(79,142,247,0.1); border:1px solid rgba(79,142,247,0.18); color:var(--accent);
    }
    /* footer */
    .footer { text-align:center; padding:2rem 6%; border-top:1px solid var(--border); color:var(--muted); font-size:0.78rem; }
    /* back-top */
    .back-top {
      position:fixed; bottom:2rem; right:2rem; z-index:900;
      width:44px; height:44px; border-radius:11px;
      background:var(--accent); color:#fff; border:none; cursor:pointer;
      font-size:1.1rem; display:flex; align-items:center; justify-content:center;
      box-shadow:0 0 20px var(--glow);
      opacity:0; pointer-events:none; transform:translateY(10px);
      transition:all 0.3s var(--ease);
    }
    .back-top.show { opacity:1; pointer-events:auto; transform:translateY(0); }
    .back-top:hover { background:#3b7ef0; transform:translateY(-3px); }

    /* ── RESPONSIVE ── */
    @media (max-width:960px) {
      .hero__inner { grid-template-columns:1fr; text-align:center; }
      .hero__photo-wrap { max-width:280px; margin:0 auto; order:-1; }
      .hero__sub { margin-left:auto; margin-right:auto; }
      .hero__btns { justify-content:center; }
      .hero__stats { justify-content:center; width:100%; }
      .about-grid { grid-template-columns:1fr; gap:3rem; }
      .edu-grid { grid-template-columns:1fr; }
      .nav__links { display:none; }
      .hamburger { display:flex; }
    }
    @media (max-width:600px) {
      .section { padding:72px 5%; }
      .tech-grid { grid-template-columns:repeat(2,1fr); }
      .str-grid { grid-template-columns:1fr 1fr; }
      @media (max-width:760px) { .str-grid { grid-template-columns:1fr 1fr; } }
      .contact-box { padding:2.2rem 1.5rem; }
      .info-grid { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ── GitHub Pages 404 redirect handler ── */
(function() {
  const redirect = sessionStorage.getItem('ghpages_redirect');
  if (redirect) {
    sessionStorage.removeItem('ghpages_redirect');
    window.history.replaceState(null, '', redirect);
  }
})();

/* ── Theme hook ── */
function useTheme() {
  const [theme, setTheme] = useState(() => {
    const saved = localStorage.getItem('theme');
    if (saved) return saved;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  });

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
  }, [theme]);

  /* Sistem teması değişince (localStorage'da manuel seçim yoksa) güncelle */
  useEffect(() => {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const handler = (e) => {
      if (!localStorage.getItem('theme')) {
        setTheme(e.matches ? 'dark' : 'light');
      }
    };
    mq.addEventListener('change', handler);
    return () => mq.removeEventListener('change', handler);
  }, []);

  const toggle = () => setTheme(t => t === 'dark' ? 'light' : 'dark');
  return [theme, toggle];
}

/* ── Router — History API, no # ── */
const ROUTES = {
  hero:         '/',
  about:        '/hakkimda',
  experience:   '/deneyim',
  stack:        '/teknolojiler',
  strengths:    '/yetkinlikler',
  education:    '/egitim',
  certificates: '/sertifikalar',
  contact:      '/iletisim',
};
const ROUTE_TO_ID = Object.fromEntries(Object.entries(ROUTES).map(([id, path]) => [path, id]));

function navigate(sectionId) {
  /* Scroll — window.scrollTo avoids the overflow-x:hidden smooth-scroll bug */
  const el = document.getElementById(sectionId);
  if (el) {
    const top = el.getBoundingClientRect().top + window.scrollY - 68;
    (document.scrollingElement || window).scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  }
  /* URL update — secondary, fail silently */
  try {
    const path = ROUTES[sectionId] || '/';
    window.history.pushState(null, '', path);
  } catch (_) {}
}

function useScrollRouter() {
  useEffect(() => {
    /* On load: scroll to section matching current URL */
    const initId = ROUTE_TO_ID[window.location.pathname];
    if (initId && initId !== 'hero') {
      setTimeout(() => {
        document.getElementById(initId)?.scrollIntoView({ behavior: 'auto' });
      }, 300);
    }

    /* Update URL on scroll — simple getBoundingClientRect approach */
    let ticking = false;
    const onScroll = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        let current = 'hero';
        for (const id of Object.keys(ROUTES)) {
          const el = document.getElementById(id);
          if (el && el.getBoundingClientRect().top <= 120) current = id;
        }
        try {
          const newPath = ROUTES[current] || '/';
          if (window.location.pathname !== newPath) {
            window.history.replaceState(null, '', newPath);
          }
        } catch (_) {}
        ticking = false;
      });
    };

    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
}

/* ── Intersection Observer hook ─────────────── */
function useReveal(threshold = 0.12) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setVisible(true); obs.unobserve(el); } }, { threshold });
    obs.observe(el);
    return () => obs.disconnect();
  }, [threshold]);
  return [ref, visible];
}

/* ── Stagger reveal ─────────────────────────── */
function useStaggerReveal(count, threshold = 0.08) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(new Array(count).fill(false));
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) {
        obs.unobserve(el);
        for (let i = 0; i < count; i++) {
          setTimeout(() => setVisible(v => { const n=[...v]; n[i]=true; return n; }), i * 75);
        }
      }
    }, { threshold });
    obs.observe(el);
    return () => obs.disconnect();
  }, [count, threshold]);
  return [ref, visible];
}

    { name:'JAVA İle Programlamaya Giriş',        issuer:'BTK Akademi',  date:'Ağu 2022',  skills:['Java','Spring Framework'] },

    { name:'Backend Web Dev Path with Beginner Java', issuer:'Patika.dev', date:'Haz 2022', skills:['Java','Spring Framework'] },
    { name:'Java (Basic)',                        issuer:'HackerRank',   date:'Haz 2022',  skills:['Java','Spring Framework'] },
    { name:'Future Of Data',                      issuer:'Go Company',   date:'Mar 2022',  skills:[] },
    { name:'Introduction to Pardus OS',           issuer:'UNX',          date:'Şub 2022',  skills:[] },
    { name:'GO (Basic)',                          issuer:'HackerRank',   date:'Oca 2022',  skills:['Go'] },

/* ══════════════════════════════════════════════
   BACK TO TOP
══════════════════════════════════════════════ */
function BackToTop() {
  const [show, setShow] = useState(false);
  useEffect(() => {
    const h = () => setShow(window.scrollY > 400);
    window.addEventListener('scroll', h, { passive: true });
    return () => window.removeEventListener('scroll', h);
  }, []);
  return (
    <button
      className={`back-top${show ? ' show' : ''}`}
      onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
      aria-label="Başa dön"
    >
      <IconArrowUp/>
    </button>
  );
}
